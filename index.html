<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CANAL Sr. VAQUINHA - Relógio Multifuso</title>
</head>
<body>
    <main class="container">
        <!-- BLOCO PRINCIPAL: Título + Hora Brasília + Data -->
        <section class="bloco-principal">
            <h1>HORÁRIO DE BRASÍLIA</h1>
            <div id="relogio01" class="clock-main">--:--:--</div>
            <div id="date" class="date-display">--</div>
        </section>

        <!-- FUSOS SECUNDÁRIOS -->
        <section class="clocks-grid">
            <div class="clock-card">
                <h2>FERNANDO DE NORONHA</h2>
                <div id="relogio2" class="clock-sub">--:--:--</div>
            </div>

            <div class="clock-card">
                <h2>AMAZONAS</h2>
                <div id="relogio3" class="clock-sub">--:--:--</div>
            </div>

            <div class="clock-card">
                <h2>ACRE</h2>
                <div id="relogio4" class="clock-sub">--:--:--</div>
            </div>
        </section>

        <!-- RODAPÉ -->
        <footer class="footer">
            <p class="sr">
                <a href="https://www.youtube.com/channel/UC3ACLDxuy75577-GDItIgNA" target="_blank" rel="noopener noreferrer">
            </p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
